<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Doboo 캐릭터 갤러리</title>
<style>
:root{color-scheme:light dark;font:15px system-ui;color:var(--color-text-primary,CanvasText);background:var(--color-background-primary,Canvas)}body{margin:0;padding:24px;max-width:860px}h1{font-size:24px;margin:0}p{line-height:1.6}header{margin-bottom:20px}nav,form,.actions{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit;padding:10px 14px;border:1px solid #8886;border-radius:10px;background:transparent;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}input{flex:1;min-width:160px}form{margin:18px 0}#status{white-space:pre-wrap;font-size:13px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}article{border:1px solid #8885;border-radius:16px;padding:18px}article h2{margin:0 0 8px;font-size:19px}.byline{font-size:12px;opacity:.7}.traits{font-size:13px}#detail{border-top:1px solid #8885;margin-top:24px;padding-top:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px system-ui}canvas{max-width:160px;max-height:180px}small{opacity:.7}
</style>
<header><h1>Doboo</h1><p>함께할 캐릭터를 찾아, 내 작업과 손목으로 데려오세요.</p></header>
<nav><button id="discover">다른 제작자의 캐릭터</button><button id="library">내 캐릭터</button></nav>
<form id="search"><input id="query" aria-label="캐릭터 검색" placeholder="이름, 제작자, 성격 검색"><button>찾기</button></form>
<p id="status" role="status">호스트에 연결하는 중입니다.</p><section id="cards" aria-label="캐릭터 목록"></section><section id="detail" hidden><h2 id="detailTitle"></h2><canvas id="sprite" width="192" height="208" hidden></canvas><pre id="detailText"></pre></section>
<script type="module">/*DOBOO_SCRIPT*/</script></html>
