name: Doboo
options:
  bundleIdPrefix: app
  developmentLanguage: en
  deploymentTarget:
    watchOS: "11.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  Doboo:
    type: application
    platform: watchOS
    sources:
      - Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doboo
        PRODUCT_NAME: Doboo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doboo
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    scheme:
      testTargets:
        - DobooTests
  DobooTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - Tests
    dependencies:
      - target: Doboo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doboo.tests
        GENERATE_INFOPLIST_FILE: YES
