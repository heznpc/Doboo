name: Doboo
options:
  bundleIdPrefix: app
  developmentLanguage: en
  deploymentTarget:
    watchOS: "11.0"
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
targets:
  Doboo:
    type: application
    platform: watchOS
    sources:
      - Sources
      - Shared
      - path: Resources
      - path: Characters
        type: folder
        buildPhase: resources
    dependencies:
      - target: DobooWidgets
        embed: true
    info:
      path: WatchSupport/Info.plist
      properties:
        CFBundleDisplayName: Doboo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: false
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: app.doboo
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.doboo.watch
            CFBundleURLSchemes:
              - doboo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doboo.watchkitapp
        PRODUCT_NAME: Doboo
        CODE_SIGN_ENTITLEMENTS: WatchSupport/Doboo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    scheme:
      testTargets:
        - DobooTests
  DobooWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widgets
        excludes:
          - Tests
      - Shared/WatchWidgetSnapshot.swift
      - Sources/Core/CharacterPack.swift
      - Sources/Core/SpriteFrame.swift
      - Sources/Core/BlobGeometry.swift
      - Sources/Core/BlobInteractionState.swift
      - Sources/DobooCharacterView.swift
      - Sources/SoftBlobShape.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Doboo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doboo.watchkitapp.widgets
        PRODUCT_NAME: DobooWidgets
        CODE_SIGN_ENTITLEMENTS: Widgets/DobooWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  DobooLibrary:
    type: application
    platform: iOS
    sources:
      - Companion
      - Shared
      - Sources/Core
      - Sources/DobooCharacterView.swift
      - Sources/SoftBlobShape.swift
      - path: Resources
        excludes:
          - Assets.xcassets
      - path: Characters
        type: folder
        buildPhase: resources
    dependencies:
      - target: Doboo
        embed: true
    info:
      path: Companion/Info.plist
      properties:
        CFBundleDisplayName: Doboo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Doboo Character
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doboo
        PRODUCT_NAME: DobooLibrary
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    scheme:
      testTargets:
        - DobooCompanionUITests
  DobooTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - Tests
    dependencies:
      - target: Doboo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doboo.tests
        GENERATE_INFOPLIST_FILE: YES

  DobooCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: DobooLibrary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.doboo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DobooLibrary
